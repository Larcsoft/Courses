# Publie le site sur GitHub Pages à chaque modification.
# Tous les dossiers « brouillon » sont exclus de la publication.
name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier qu'aucune adresse de l'école n'est publiée
        # Sens unique : Google Sites pointe vers GitHub, jamais l'inverse
        run: |
          if grep -rniE 'sites\.google\.com|docs\.google\.com|drive\.google\.com|classroom\.google\.com|arc-en-ciel\.org' \
               --include='*.html' --include='*.css' --include='*.js' --exclude-dir=brouillon --exclude-dir=.git .; then
            echo "::error::Une adresse de l'école apparaît ci-dessus. Retire-la, puis enregistre à nouveau."
            exit 1
          fi
      - name: Préparer les fichiers publics
        run: |
          mkdir _site
          rsync -a --exclude='.git*' --exclude='.github' --exclude='brouillon/' \
                --exclude='README.md' --exclude='inventaire.csv' --exclude='/outils/' ./ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
